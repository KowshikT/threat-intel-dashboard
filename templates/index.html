<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threat Management System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0d0d0d;
    color: #e8e8e8;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
}

header {
    padding: 24px 40px;
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    font-size: 1.5em;
    font-weight: 600;
    letter-spacing: 0.8px;
}

.header-icon {
    font-size: 1.2em;
    color: #00d9ff;
}

.dashboard-section {
    padding: 20px 40px;
    background: #121212;
    border-bottom: 1px solid #2a2a2a;
}

.controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 40px;
}

.status-group {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95em;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00d9ff;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.status-text {
    color: #b0b0b0;
}

.status-value {
    color: #e8e8e8;
    font-weight: 600;
    margin-left: 4px;
}

.threat-badge {
    background: #ff4444;
    color: #fff;
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 0.85em;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.dashboard {
    padding: 40px;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #1a1a1a;
}

th, td {
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid #2a2a2a;
}

th {
    background: #0d0d0d;
    color: #00d9ff;
    font-weight: 600;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 1px;
}

td {
    color: #d8d8d8;
    font-size: 0.95em;
}

tr:hover {
    background: #242424;
}

.url-cell {
    max-width: 350px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: 'Courier New', monospace;
    font-size: 0.9em;
    color: #a8a8a8;
}

.threat-id {
    color: #888;
    font-family: 'Courier New', monospace;
    font-size: 0.9em;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 0.9em;
    font-weight: 600;
    width: fit-content;
}

.status-active {
    background: rgba(0, 200, 80, 0.15);
    color: #00c850;
    border: 1px solid rgba(0, 200, 80, 0.3);
}

.status-inactive {
    background: rgba(200, 50, 50, 0.15);
    color: #ff6b6b;
    border: 1px solid rgba(200, 50, 50, 0.3);
}

.status-dot-badge {
    width: 5px;
    height: 5px;
    border-radius: 50%;
}

.category-tag {
    background: rgba(0, 217, 255, 0.1);
    color: #00d9ff;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 0.9em;
    border: 1px solid rgba(0, 217, 255, 0.2);
    display: inline-block;
}

.action-btn {
    background: transparent;
    color: #00d9ff;
    border: 1px solid #00d9ff;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85em;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.action-btn:hover {
    background: rgba(0, 217, 255, 0.1);
    box-shadow: 0 0 12px rgba(0, 217, 255, 0.3);
}

.action-btn:active {
    transform: scale(0.95);
}

.action-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.fade-in {
    animation: fadeIn 0.4s ease-in;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}
</style>
</head>
<body>
<header>
    <i class="fas fa-shield-alt header-icon"></i>
    Threat Management System
</header>

<div class="dashboard-section">
    <div class="controls-row">
        <div class="status-group">
            <div class="status-dot"></div>
            <span class="status-text">System Status:</span>
            <span class="status-value" id="current-time">--:--:--</span>
        </div>
        <div class="status-group">
            <span class="status-text">Threat Type:</span>
            <span class="threat-badge">Phishing URLs</span>
        </div>
    </div>
</div>

<div class="dashboard-section">
    <div class="status-group">
        <div class="status-dot"></div>
        <span class="status-text">Last Updated:</span>
        <span class="status-value" id="timestamp">--:--:--</span>
    </div>
</div>

<div class="dashboard fade-in">
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Malicious URL</th>
                    <th>Threat ID</th>
                    <th>Status</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for row in threats %}
                <tr>
                    <td class="url-cell" title="{{ row[0] }}">{{ row[0] }}</td>
                    <td class="threat-id">{{ row[1] }}</td>
                    <td>
                        {% if row[2] == "online" %}
                        <span class="status-badge status-active">
                            <span class="status-dot-badge" style="background: #00c850;"></span>
                            Active
                        </span>
                        {% else %}
                        <span class="status-badge status-inactive">
                            <span class="status-dot-badge" style="background: #ff6b6b;"></span>
                            Inactive
                        </span>
                        {% endif %}
                    </td>
                    <td><span class="category-tag">{{ row[3] }}</span></td>
                    <td>
                        <button class="action-btn" data-url="{{ row[0] }}">
                            <i class="fas fa-unlock"></i>Unblock
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
    function updateTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('current-time').textContent = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateTime, 1000);
    updateTime();
</script>

<script>
    function refreshTable() {
        fetch('/refresh-table')
            .then(response => response.text())
            .then(html => {
                document.querySelector("tbody").innerHTML = html;
                const now = new Date();
                const formatted = now.toLocaleTimeString();
                document.getElementById("timestamp").textContent = formatted;
            })
            .catch(err => console.error("Refresh failed:", err));
    }

    setInterval(refreshTable, 30000);
    refreshTable();
</script>

<script>
document.addEventListener("click", function (e) {
    const btn = e.target.closest(".action-btn");
    if (!btn) return;

    const url = btn.dataset.url;
    if (!url) return;

    if (!confirm(`Confirm unblock:\n\n${url}`)) return;

    btn.disabled = true;
    
    fetch("/unblock", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: url }),
    })
    .then(async res => {
        const text = await res.text();
        let data;
        try {
            data = JSON.parse(text);
        } catch (e) {
            alert("Server error:\n" + text);
            throw e;
        }
        return data;
    })
    .then(data => {
        alert(data.message || (data.success ? "Unblocked" : "Failed"));

        if (data.success) {
            const row = btn.closest("tr");
            if (row) {
                row.style.opacity = "0.4";
                row.style.pointerEvents = "none";
            }
        } else {
            btn.disabled = false;
        }
    })
    .catch(err => {
        console.error(err);
        alert("Error occurred");
        btn.disabled = false;
    });
});
</script>

</body>
</html>
